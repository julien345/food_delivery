
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. Vérifier et compiler l'API
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./API

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: ./API/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Compiler le TypeScript
        run: npm run build

  # 2. Construire et publier les images Docker
  publish-images:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image de l'API
      - name: Préparer les tags de l'API
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/julien345/food_delivery-api
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Construire et publier l'API
        uses: docker/build-push-action@v6
        with:
          context: ./API
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Image du frontend
      - name: Préparer les tags du frontend
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/julien345/food_delivery-frontend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Construire et publier le frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/API
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend