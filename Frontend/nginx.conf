server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /API/ {
        proxy_pass ${API_URL};
        proxy_set_header Host ${API_HOST};
        proxy_ssl_server_name on;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}