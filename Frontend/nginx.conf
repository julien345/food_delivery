server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Autorise l'envoi de photos jusqu'à 5 Mo
    client_max_body_size 5M;

    location /API/ {
        proxy_pass http://${API_HOSTPORT};
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
