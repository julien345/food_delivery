databases:
  - name: julien-food-db
    plan: free
    region: frankfurt

services:
  # --- 1. BACKEND (API) ---
  - type: web
    name: julien-food-api
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: ghcr.io/julien345/food_delivery-api:latest
    # On force l'écoute sur le port 3000 correspondant à votre configuration Docker locale
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: julien-food-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  # --- 2. FRONTEND (WEB) ---
  - type: web
    name: julien-food-web
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: ghcr.io/julien345/food_delivery-web:latest # Ajustez le nom de l'image si nécessaire
    envVars:
      - key: PORT
        value: 80
      - key: VITE_API_URL
        # Utilise l'URL réseau privée et sécurisée de Render pour le proxy_pass d'Nginx
        value: http://julien-food-api:3000
