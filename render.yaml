databases:
  - name: julien-food-db
    plan: free
    region: frankfurt

services:
  # --- 1. BACKEND (API via votre image GHCR) ---
  - type: web
    name: julien-food-api
    runtime: image
    plan: free
    region: frankfurt
    image:
      url: ghcr.io/julien345/food_delivery-api:latest
    dockerCommand: sh -c "npx prisma migrate deploy && node dist/server.js"
    envVars:
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: julien-food-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

  # --- 2. FRONTEND (Compilé directement par Render) ---
  - type: web
    name: julien-food-web
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com
    branch: main
    dockerfilePath: Frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://onrender.com
      - key: PORT
        value: 80
